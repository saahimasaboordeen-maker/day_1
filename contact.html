<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Contact - Students Information System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container-fluid">

            <a class="navbar-brand" href="index.html">
                Students Information System
            </a>

            <ul class="navbar-nav flex-row">

                <li class="nav-item">
                    <a class="nav-link px-3" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link px-3" href="form.html">Form</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link px-3" href="about.html">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link px-3 active" href="contact.html">Contact</a>
                </li>

            </ul>

        </div>

    </nav>

    <!-- Contact Form -->
    <div class="container mt-5 flex-grow-1">

        <h2 class="mb-4">Contact Us</h2>

        <form onsubmit="return validateForm()">

            <!-- Name -->
            <div class="mb-3">

                <label class="form-label" for="name">Name</label>

                <input type="text"
                       id="name"
                       name="name"
                       class="form-control"
                       placeholder="Enter Name"
                       required>

            </div>

            <!-- Email -->
            <div class="mb-3">

                <label class="form-label" for="email">Email</label>

                <input type="email"
                       id="email"
                       name="email"
                       class="form-control"
                       placeholder="Enter Email"
                       required>

            </div>

            <!-- Message -->
            <div class="mb-3">

                <label class="form-label" for="message">Message</label>

                <textarea id="message"
                          name="message"
                          class="form-control"
                          rows="5"
                          placeholder="Enter Message"
                          required></textarea>

            </div>

            <!-- Buttons -->
            <button type="submit" class="btn btn-success">
                Submit
            </button>

            <button type="reset" class="btn btn-secondary">
                Clear Form
            </button>

        </form>

    </div>

    <!-- JavaScript Validation -->
    <script>

        function validateForm() {

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let message = document.getElementById("message").value.trim();

            if (name === "" || email === "" || message === "") {
                alert("All fields are required!");
                return false;
            }

            alert("Contact form submitted successfully!");

            return false;

        }

    </script>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">

        <p class="mb-0">
            Developed by Saahima | 2026
        </p>

    </footer>

</body>

</html>
